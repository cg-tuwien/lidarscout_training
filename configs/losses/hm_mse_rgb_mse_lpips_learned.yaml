model:
  init_args:
    output_names:
      - 'hm_mse'
      - 'rgb_mse'
      - 'rgb_lpips'
    loss_module:
      class_path: source.modules.losses.LossMixer
      init_args:
        use_valid_pixel_mask: True
        learned_weights: True
        weights:
        - 1.0
        - 1.0
        - 1.0
        losses:
        - class_path: source.modules.losses.LossComponent
          init_args:
            name: 'hm_mse'
            kind: 'mse'
            target: 'hm'
        - class_path: source.modules.losses.LossComponent
          init_args:
            name: 'rgb_mse'
            kind: 'mse'
            target: 'rgb'
        - class_path: source.modules.losses.LossComponent
          init_args:
            name: 'rgb_lpips'
            kind: 'lpips'
            target: 'rgb'